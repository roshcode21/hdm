name: Build HDM visual assets
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/optimize.py'
      - '.github/workflows/optimize-assets.yml'
concurrency:
  group: optimize-hdm-assets
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Optimize high-quality original era art
        run: |
          python -m pip install --quiet pillow
          python scripts/optimize.py
      - name: Commit image derivatives for GitHub Pages branch deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hdm/
          if ! git diff --staged --quiet; then
            git commit -m "Publish optimized HDM era artwork [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push
          fi
